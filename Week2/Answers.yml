## 1. **Difference between `push()`, `pop()`, `shift()`, and `unshift()`**

* `push()` → adds element at **end** of array
* `pop()` → removes element from **end**
* `shift()` → removes element from **start**
* `unshift()` → adds element at **start**

```js
let arr = [1, 2, 3];
arr.push(4);      // [1,2,3,4]
arr.pop();        // [1,2,3]
arr.shift();      // [2,3]
arr.unshift(0);   // [0,2,3]
```

---

### 2. **Difference between `slice()` and `splice()`**

* `slice(start, end)` → **does not change** original, returns copy.
* `splice(start, deleteCount, ...items)` → **changes** original, can remove/insert.

```js
let arr = [1,2,3,4];
console.log(arr.slice(1,3)); // [2,3]  original stays same
console.log(arr.splice(1,2)); // removes [2,3], arr becomes [1,4]
```
---

### 4. **Difference between `find()` and `filter()`**

* `find()` → returns **first matching element**.
* `filter()` → returns **all matching elements** as array.

```js
let arr = [10, 20, 30, 40];
console.log(arr.find(x => x > 20));   // 30
console.log(arr.filter(x => x > 20)); // [30,40]
```

---

### 5. **Difference between `some()` and `every()`**

* `some()` → returns **true** if at least **one element** matches.
* `every()` → returns **true** if **all elements** match.

```js
let arr = [1,2,3,4];
console.log(arr.some(x => x>3));   // true
console.log(arr.every(x => x>0));  // true
```

---

### 6. **How do you check if two arrays are equal?**

By comparing length + each element:

```js
function arraysEqual(a, b) {
  if(a.length !== b.length) return false;
  return a.every((val, i) => val === b[i]);
}

console.log(arraysEqual([1,2,3],[1,2,3])); // true
console.log(arraysEqual([1,2,3],[1,3,2])); // false
```

---

---

### 8. **Reverse an array without using built-in methods**

```js
function reverseArray(arr) {
  let result = [];
  for(let i=arr.length-1; i>=0; i--) {
    result.push(arr[i]);
  }
  return result;
}
console.log(reverseArray([1,2,3])); // [3,2,1]
```

---

### 10. **How do you remove duplicates from an array?**

```js
let arr = [1,2,2,3,4,4,5];
let unique = [...new Set(arr)];
console.log(unique); // [1,2,3,4,5]
```

---

### 12. **How do you sort an array of numbers correctly in JavaScript?**

⚠️ By default `sort()` treats numbers as **strings**.
Use a compare function:

```js
let arr = [10, 2, 5, 1];
arr.sort();              // [1,10,2,5] ❌ wrong
arr.sort((a,b) => a-b);  // [1,2,5,10] ✅ correct

